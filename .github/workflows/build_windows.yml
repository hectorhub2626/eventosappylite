name: Compilar Executable de Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Instalar dependencias de compilacion
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pyinstaller

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all pandas --collect-all matplotlib --name="App_Muestras" App.py

      - name: Subir ejecutable (.exe) como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: App-Muestras-Ejecutable
          path: dist/App_Muestras/

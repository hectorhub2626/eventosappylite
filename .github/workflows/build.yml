name: Validar y Ejecutar App GUI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instalar dependencias del sistema para GUI en Linux
      - name: Instalar dependencias del sistema (Tkinter y Pantalla Virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      # 4. Instalar librerías de Python (pandas, matplotlib)
      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Ejecutar la App simulando una pantalla
      - name: Ejecutar App con Xvfb
        run: |
          xvfb-run python App.py
